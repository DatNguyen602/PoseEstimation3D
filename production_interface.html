<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Estimation - Video Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
        }

        .result-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .video-container {
            text-align: center;
            margin: 20px 0;
        }

        video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .score-display {
            background: linear-gradient(45deg, #00d4ff, #090979);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }

        .loading {
            text-align: center;
            color: #ffd700;
            font-size: 18px;
            padding: 20px;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #ccc;
            font-size: 14px;
        }

        .stat-value {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Pose Estimation Video Comparison</h1>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2>📤 Upload Videos</h2>
            <form id="comparisonForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="userVideo">🎯 Your Performance Video:</label>
                        <input type="file" id="userVideo" accept="video/*" required>
                    </div>
                    <div class="form-group">
                        <label for="referenceVideo">📋 Reference Video:</label>
                        <input type="file" id="referenceVideo" accept="video/*" required>
                    </div>
                </div>
                <button type="submit" class="btn" id="compareBtn">
                    🚀 Compare Videos
                </button>
            </form>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading" style="display: none;">
            ⏳ Processing videos... Please wait...
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section" style="display: none;">
            <h2>📊 Comparison Results</h2>

            <!-- Result Card -->
            <div id="resultCard" class="result-card">
                <h3>📈 Analysis Summary</h3>
                <div class="score-display">
                    <div class="score-value" id="similarityScore">-</div>
                    <div>Similarity Score</div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Frames Processed</div>
                        <div class="stat-value" id="framesProcessed">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Min Score</div>
                        <div class="stat-value" id="minScore">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Max Score</div>
                        <div class="stat-value" id="maxScore">-</div>
                    </div>
                </div>
            </div>

            <!-- Video Display -->
            <div class="video-container">
                <h3>🎥 Comparison Video</h3>
                <video id="comparisonVideo" controls>
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Error Display -->
        <div id="errorSection" class="error" style="display: none;"></div>
    </div>

    <script>
        // DOM Elements
        const comparisonForm = document.getElementById('comparisonForm');
        const compareBtn = document.getElementById('compareBtn');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const errorSection = document.getElementById('errorSection');
        const comparisonVideo = document.getElementById('comparisonVideo');

        // API Base URL
        const API_BASE = 'http://localhost:8000';

        // Handle form submission
        comparisonForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const userFile = document.getElementById('userVideo').files[0];
            const referenceFile = document.getElementById('referenceVideo').files[0];

            if (!userFile || !referenceFile) {
                showError('Please select both video files');
                return;
            }

            // Prepare form data
            const formData = new FormData();
            formData.append('user_video', userFile);
            formData.append('reference_video', referenceFile);

            // Show loading
            showLoading();
            hideResults();
            hideError();

            try {
                // Make API call
                const response = await fetch(`${API_BASE}/api/compare_videos/`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                // Display results
                displayResults(result);

            } catch (error) {
                console.error('Error:', error);
                showError(`Error comparing videos: ${error.message}`);
            } finally {
                hideLoading();
            }
        });

        // Display results function
        function displayResults(result) {
            // Update similarity score
            document.getElementById('similarityScore').textContent =
                (result.average_similarity_score * 100).toFixed(1) + '%';

            // Update stats
            document.getElementById('framesProcessed').textContent =
                result.total_frames_processed || 0;
            document.getElementById('minScore').textContent =
                (result.score_range?.min * 100 || 0).toFixed(1) + '%';
            document.getElementById('maxScore').textContent =
                (result.score_range?.max * 100 || 0).toFixed(1) + '%';

            // Set video source with error handling
            if (result.side_by_side_video_url) {
                const videoUrl = `${API_BASE}${result.side_by_side_video_url}`;
                comparisonVideo.src = videoUrl;

                // Handle video load errors
                comparisonVideo.addEventListener('error', function() {
                    console.error('Video failed to load:', videoUrl);
                    showError('Failed to load comparison video. The video might still be processing.');
                });

                comparisonVideo.addEventListener('loadeddata', function() {
                    console.log('Video loaded successfully');
                });
            }

            // Show results section
            resultsSection.style.display = 'block';
        }

        // Helper functions
        function showLoading() {
            loading.style.display = 'block';
            compareBtn.disabled = true;
            compareBtn.textContent = 'Processing...';
        }

        function hideLoading() {
            loading.style.display = 'none';
            compareBtn.disabled = false;
            compareBtn.textContent = '🚀 Compare Videos';
        }

        function showResults() {
            resultsSection.style.display = 'block';
        }

        function hideResults() {
            resultsSection.style.display = 'none';
        }

        function showError(message) {
            errorSection.textContent = message;
            errorSection.style.display = 'block';
        }

        function hideError() {
            errorSection.style.display = 'none';
        }

        // Video error handling
        comparisonVideo.addEventListener('error', function() {
            console.error('Video error:', this.error);
            showError('Unable to play video. Please check if the video file exists and try again.');
        });

        // Check if server is running
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/`);
                if (response.ok) {
                    console.log('✅ Server is running');
                } else {
                    console.warn('⚠️ Server responded with status:', response.status);
                }
            } catch (error) {
                console.error('❌ Server not accessible:', error.message);
            }
        }

        // Initialize
        checkServerStatus();
    </script>
</body>
</html>
